<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Worker App - Clean Gudlavalleru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
<style>
  :root { --wb: #1e3a8a; --wb2: #2563eb; --wo: #f97316; }
  body { background: #eef2f7; }
  html[lang="te"] body { font-family: "Noto Sans Telugu", "Nirmala UI", "Segoe UI", sans-serif; }
  .ff { font-family: Poppins, "Noto Sans Telugu", "Segoe UI", sans-serif; }
  .shell { max-width: 560px; margin: 0 auto; min-height: 100vh; background: #f6f8fb; position: relative; box-shadow: 0 0 40px rgba(15,23,42,.08); }
  .lang-switch { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.95); color: var(--wb); border: 0; font: inherit; font-weight: 800; border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 14px; }

  /* ---------- login ---------- */
  .wl-hero { background: radial-gradient(circle at 80% 0%, #3b82f6 0%, #1e40af 40%, #0b1f4d 100%); color: #fff; padding: 18px 20px 130px; position: relative; overflow: hidden; }
  .wl-top { display: flex; justify-content: space-between; align-items: center; }
  .wl-top a { color: #bfdbfe; text-decoration: none; font-weight: 600; font-size: 14px; }
  .wl-hero h1 { font-size: 30px; margin: 26px 0 6px; }
  .wl-hero p { color: #bfdbfe; margin: 0; max-width: 56%; }
  .wl-hero svg { position: absolute; right: 4px; bottom: 58px; width: 160px; height: auto; }
  .wl-card { background: #fff; border-radius: 26px 26px 0 0; margin-top: -60px; position: relative; padding: 28px 22px 30px; min-height: 60vh; }
  .field { position: relative; }
  .field .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 18px; opacity: .6; pointer-events: none; }
  .field input { padding-left: 46px !important; height: 54px; border-radius: 14px !important; font-size: 17px !important; }
  .field .eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: none; cursor: pointer; font-size: 19px; padding: 8px; border-radius: 10px; }
  .bigbtn { height: 56px; font-size: 18px !important; border-radius: 16px !important; width: 100%; }

  /* ---------- app ---------- */
  .whead { background: linear-gradient(135deg, #1e3a8a, #2563eb); color: #fff; padding: 16px 18px 56px; border-radius: 0 0 28px 28px; }
  .whead .row { display: flex; align-items: center; gap: 12px; }
  .whead .av { width: 48px; height: 48px; border-radius: 16px; background: #fff; color: var(--wb); font-weight: 800; font-size: 21px; display: flex; align-items: center; justify-content: center; flex: none; cursor: pointer; }
  .whead h1 { font-size: 20px; margin: 0; line-height: 1.2; }
  .whead small { color: #bfdbfe; font-size: 13px; }
  .whead .icons { margin-left: auto; display: flex; gap: 6px; }
  .whead .icons button { width: 40px; height: 40px; border-radius: 12px; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 17px; cursor: pointer; }
  .wbody { padding: 0 14px 100px; margin-top: -40px; }
  .sumrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .sum { background: #fff; border-radius: 18px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
  .sum b { display: block; font-size: 28px; line-height: 1.1; }
  .sum span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 800; margin: 22px 4px 10px; display: flex; align-items: center; gap: 8px; }
  .sec .n { background: #e2e8f0; color: #334155; border-radius: 999px; padding: 1px 9px; letter-spacing: 0; }

  .now { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; border-radius: 22px; padding: 16px; box-shadow: 0 12px 30px rgba(234,88,12,.35); display: flex; gap: 14px; align-items: center; cursor: pointer; }
  .now img { width: 84px; height: 84px; border-radius: 16px; object-fit: cover; flex: none; border: 3px solid rgba(255,255,255,.6); }
  .now .lbl { font-size: 12px; font-weight: 800; letter-spacing: .06em; opacity: .9; }
  .now h3 { font-size: 19px; margin: 2px 0; }
  .now .go { margin-left: auto; font-size: 26px; }

  .jcard { background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 12px; display: flex; gap: 12px; margin-bottom: 10px; cursor: pointer; position: relative; border: 2px solid transparent; transition: transform .1s; }
  .jcard:active { transform: scale(.98); }
  .jcard.high { border-color: #fecaca; }
  .jcard img { width: 92px; height: 92px; border-radius: 14px; object-fit: cover; flex: none; }
  .jcard h3 { font-size: 17px; margin: 0 0 4px; }
  .jcard .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pill2 { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: #f1f5f9; color: #334155; white-space: nowrap; }
  .pill2.red { background: #fee2e2; color: #991b1b; }
  .pill2.amber { background: #fef3c7; color: #92400e; }
  .pill2.blue { background: #dbeafe; color: #1e40af; }
  .pill2.green { background: #dcfce7; color: #166534; }
  .newdot { position: absolute; top: -6px; right: -4px; background: #ef4444; color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; box-shadow: 0 2px 8px rgba(239,68,68,.5); }
  .empty2 { background: #fff; border-radius: 20px; padding: 30px 16px; text-align: center; color: var(--muted); box-shadow: var(--shadow); }
  .empty2 div { font-size: 46px; }

  .bnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 560px; background: #fff; display: grid; grid-template-columns: repeat(4, 1fr); box-shadow: 0 -6px 20px rgba(15,23,42,.08); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); z-index: 1200; border-radius: 22px 22px 0 0; }
  .bnav button { border: 0; background: none; font: inherit; font-size: 12px; font-weight: 700; color: #64748b; padding: 6px 2px; border-radius: 14px; cursor: pointer; position: relative; }
  .bnav button span { display: block; font-size: 22px; line-height: 1.2; }
  .bnav button.on { color: var(--wb); background: #eff6ff; }
  .bnav .dot { position: absolute; top: 4px; right: 26%; background: #ef4444; color: #fff; font-size: 10px; font-weight: 800; border-radius: 999px; min-width: 18px; padding: 0 5px; }

  /* job sheet */
  .sheet { position: fixed; inset: 0; z-index: 2000; background: rgba(15,23,42,.5); display: flex; justify-content: center; align-items: flex-end; }
  .sheet .inner { background: #f6f8fb; width: 100%; max-width: 560px; height: 100%; overflow-y: auto; animation: up .28s cubic-bezier(.2,.9,.3,1); }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sheet .hero { position: relative; }
  .sheet .hero img { width: 100%; height: 260px; object-fit: cover; display: block; }
  .sheet .back { position: absolute; top: 12px; left: 12px; width: 44px; height: 44px; border-radius: 14px; border: 0; background: rgba(255,255,255,.92); font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.2); }
  .sheet .hero .tagx { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  .sheet .content { padding: 16px; }
  .stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 16px; }
  .stepper div { text-align: center; font-size: 11px; font-weight: 700; color: #94a3b8; }
  .stepper div i { display: block; height: 6px; border-radius: 3px; background: #e2e8f0; margin-bottom: 6px; }
  .stepper div.done { color: #16a34a; } .stepper div.done i { background: #16a34a; }
  .stepper div.cur { color: var(--wb); } .stepper div.cur i { background: var(--wb2); }
  .stepcard { background: #fff; border-radius: 20px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .stepcard h3 { font-size: 18px; margin: 0 0 6px; display: flex; gap: 10px; align-items: center; }
  .stepcard h3 .num { width: 30px; height: 30px; border-radius: 10px; background: var(--wb2); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .note-box { background: #fef3c7; color: #78350f; padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-top: 10px; }
  .warn-box { background: #fee2e2; color: #7f1d1d; padding: 10px 12px; border-radius: 12px; font-size: 14px; margin-top: 10px; font-weight: 600; }
  .timer { font-size: 34px; font-weight: 800; color: var(--wb); font-variant-numeric: tabular-nums; }
  .cam { border: 3px dashed #93c5fd; background: #eff6ff; border-radius: 18px; padding: 22px; text-align: center; display: block; cursor: pointer; font-weight: 700; color: var(--wb); }
  .cam span { font-size: 46px; display: block; }

  .hist { background: #fff; border-radius: 20px; padding: 12px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .hist .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .hist .pics img { width: 100%; height: 110px; object-fit: cover; border-radius: 12px; }
  .hist .pics small { font-size: 11px; font-weight: 800; color: var(--muted); letter-spacing: .05em; }

  .pcard { background: #fff; border-radius: 20px; padding: 18px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .pstats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pstats div { background: #f8fafc; border-radius: 14px; padding: 12px; }
  .pstats b { display: block; font-size: 24px; }
  .pstats span { font-size: 12px; color: var(--muted); font-weight: 700; }
  .plist button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 6px; border: 0; border-bottom: 1px solid var(--line); background: none; font: inherit; font-weight: 600; cursor: pointer; text-align: left; font-size: 16px; }
  .plist button:last-child { border-bottom: 0; }
  .plist button span:last-child { margin-left: auto; color: var(--muted); font-size: 14px; }

  .toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); top: 12px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; width: calc(100% - 24px); max-width: 520px; }
  .toast { background: #0f172a; color: #fff; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 14px 40px rgba(0,0,0,.3); cursor: pointer; animation: tin .35s cubic-bezier(.3,1.4,.6,1); border-left: 6px solid var(--tc, #22c55e); }
  .toast img { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; flex: none; }
  .toast b { display: block; }
  .toast small { color: #cbd5e1; }
  @keyframes tin { from { transform: translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="shell">

  <!-- ===================== LOGIN ===================== -->
  <div id="loginView" class="hidden">
    <div class="wl-hero">
      <div class="wl-top"><a href="/" data-i18n="backSite">← Website</a><button class="lang-switch js-lang">🌐 <span class="js-lang-label">తెలుగు</span></button></div>
      <h1 class="ff" data-i18n="appName">Worker App</h1>
      <p data-i18n="loginLead">See your cleaning jobs, check in on site and upload the after photo.</p>
      <svg viewBox="0 0 200 170" aria-hidden="true">
        <ellipse cx="100" cy="164" rx="90" ry="6" fill="rgba(0,0,0,.25)"/>
        <!-- cart -->
        <path d="M118 96 h66 l-6 48 h-54 z" fill="#16a34a"/><rect x="114" y="90" width="74" height="9" rx="4" fill="#15803d"/>
        <circle cx="132" cy="152" r="10" fill="#111827"/><circle cx="170" cy="152" r="10" fill="#111827"/><text x="151" y="128" text-anchor="middle" font-size="18" fill="#fff">♻</text>
        <!-- worker -->
        <rect x="62" y="112" width="11" height="44" rx="5" fill="#334155"/><rect x="78" y="112" width="11" height="44" rx="5" fill="#334155"/>
        <rect x="58" y="66" width="36" height="52" rx="12" fill="#f97316"/><rect x="58" y="84" width="36" height="5" fill="#e5e7eb"/><rect x="58" y="98" width="36" height="5" fill="#e5e7eb"/>
        <circle cx="76" cy="50" r="15" fill="#a0673d"/><path d="M59 48 a17 17 0 0 1 34 0 z" fill="#facc15"/><rect x="56" y="45" width="40" height="5" rx="2.5" fill="#eab308"/>
        <circle cx="81" cy="52" r="1.8" fill="#111"/><path d="M76 58 q4 3 8 0" stroke="#7c2d12" stroke-width="1.8" fill="none"/>
        <line x1="92" y1="76" x2="112" y2="104" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
        <line x1="110" y1="60" x2="96" y2="150" stroke="#a16207" stroke-width="4" stroke-linecap="round"/>
        <path d="M92 146 l-14 18 h30 l-8 -18 z" fill="#d6b36a"/>
      </svg>
    </div>
    <div class="wl-card">
      <h2 class="ff" style="font-size:24px;margin:0" data-i18n="loginTitle">Log in</h2>
      <p class="hint" style="margin:4px 0 4px" data-i18n="loginSub">Use the username and password given by your department.</p>
      <label for="lu" data-i18n="username">Username</label>
      <div class="field"><span class="ic">👤</span><input type="text" id="lu" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
      <label for="lp" data-i18n="password">Password</label>
      <div class="field"><span class="ic">🔒</span><input type="password" id="lp" autocomplete="current-password"><button class="eye" id="eyeBtn" type="button" aria-label="Show password">👁️</button></div>
      <div id="loginMsg"></div>
      <button class="btn blue bigbtn" id="loginBtn" style="margin-top:22px" data-i18n="loginBtn">Log in</button>
      <p class="hint" style="text-align:center;margin-top:18px" data-i18n="forgot">Forgot your password? Ask your department to reset it.</p>
    </div>
  </div>

  <!-- ===================== APP ===================== -->
  <div id="appView" class="hidden">
    <header class="whead">
      <div class="row">
        <div class="av" id="meAv" title="Profile">R</div>
        <div><h1 class="ff" id="hello"></h1><small id="meZone"></small></div>
        <div class="icons"><button id="soundBtn" title="Sound">🔔</button><button class="js-lang" title="Language" style="width:auto;padding:0 10px;font-weight:800;font-size:13px"><span class="js-lang-label">తెలుగు</span></button></div>
      </div>
      <div style="margin-top:12px;font-size:13px;color:#bfdbfe" id="todayLine"></div>
    </header>

    <div class="wbody">
      <!-- JOBS -->
      <section id="v-jobs">
        <div class="sumrow" id="sumRow"></div>
        <div id="nowBox"></div>
        <div id="jobsList"></div>
      </section>
      <!-- MAP -->
      <section id="v-map" class="hidden">
        <div class="stepcard" style="padding:8px"><div id="wmap" class="map" style="height:calc(100vh - 230px);min-height:380px;border-radius:14px"></div></div>
        <p class="hint" style="text-align:center" data-i18n="mapHint">Tap a pin to open the job. Blue dot = you.</p>
      </section>
      <!-- HISTORY -->
      <section id="v-history" class="hidden">
        <div class="sec" style="margin-top:6px"><span data-i18n="historyTitle">Finished jobs</span></div>
        <div id="historyList"></div>
      </section>
      <!-- PROFILE -->
      <section id="v-profile" class="hidden">
        <div class="pcard" style="text-align:center">
          <div class="av" id="pAv" style="width:76px;height:76px;border-radius:24px;background:#dbeafe;color:#1e3a8a;font-weight:800;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px"></div>
          <h2 class="ff" style="margin:0;font-size:22px" id="pName"></h2>
          <div class="hint" id="pInfo"></div>
        </div>
        <div class="pcard"><div class="pstats" id="pStats"></div></div>
        <div class="pcard plist">
          <button id="pwBtn"><span>🔑</span><span data-i18n="changePw">Change password</span><span>›</span></button>
          <button class="js-lang"><span>🌐</span><span data-i18n="language">Language</span><span class="js-lang-cur">English</span></button>
          <button id="soundBtn2"><span>🔔</span><span data-i18n="sound">Alert sound</span><span id="soundState"></span></button>
          <button id="logoutBtn" style="color:#b91c1c"><span>⎋</span><span data-i18n="logout">Log out</span><span></span></button>
        </div>
        <form class="pcard hidden" id="pwForm">
          <h3 style="margin-top:0" data-i18n="changePw">Change password</h3>
          <label for="pwOld" data-i18n="oldPw">Current password</label><input type="password" id="pwOld" autocomplete="current-password">
          <label for="pwNew" data-i18n="newPw">New password (min 6 characters)</label><input type="password" id="pwNew" autocomplete="new-password">
          <div id="pwMsg"></div>
          <button class="btn blue block" style="margin-top:14px" data-i18n="save">Save</button>
        </form>
      </section>
    </div>

    <nav class="bnav">
      <button data-view="jobs" class="on"><span>🧹</span><b data-i18n="navJobs">Jobs</b><i class="dot hidden" id="jobsDot"></i></button>
      <button data-view="map"><span>🗺️</span><b data-i18n="navMap">Map</b></button>
      <button data-view="history"><span>✅</span><b data-i18n="navHistory">History</b></button>
      <button data-view="profile"><span>👤</span><b data-i18n="navProfile">Profile</b></button>
    </nav>
  </div>
</div>

<div class="sheet hidden" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="toast-wrap" id="toasts" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/common.js"></script>
<script src="/js/worker.js"></script>
</body>
</html>
